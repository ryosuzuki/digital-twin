<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="844" viewBox="0 0 1500 844" role="img" aria-labelledby="title desc"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52657c"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:43px;font-weight:700}.sub{font-size:23px;fill:#52657c}.label{font-size:27px;font-weight:700}.body{font-size:23px}.small{font-size:20px;fill:#52657c}.edge{stroke:#52657c;stroke-width:3;fill:none;marker-end:url(#arrow)}.box{stroke:#c5cfdb;stroke-width:2;rx:18}</style><rect width="1500" height="844" fill="#f8fafc"/><title id="title">On-device object detection to first-person AR</title><desc id="desc">Quest camera pixels and exposure pose feed local YOLO detection. Calibrated center rays intersect environment depth. Session-anchored labels are rendered over compositor passthrough. All runtime inference stays on Quest.</desc><text x="60" y="78" class="title">From camera pixels to first-person AR</text><text x="60" y="119" class="sub">Unity native 0.3.0 · All inference on Quest 3 / 3S · No external GPU server</text>
<path class="edge" d="M425 282H530"/><path class="edge" d="M930 282H1040"/><path class="edge" d="M1240 365V414"/><path class="edge" d="M1040 540V596"/><path class="edge" d="M530 665H640"/>
<rect x="60" y="192" width="365" height="173" class="box" fill="#dbeafe"/><text x="84" y="237" class="label">1 · Headset camera</text><text x="84" y="279" class="body">RGB pixels + camera pose</text><text x="84" y="320" class="small">Passthrough Camera API</text>
<rect x="530" y="192" width="400" height="173" class="box" fill="#e0e7ff"/><text x="554" y="237" class="label">2 · Local YOLO</text><text x="554" y="279" class="body">Class + 2D bounding box</text><text x="554" y="320" class="small">Unity Inference Engine · GPUCompute</text>
<rect x="1040" y="192" width="400" height="173" class="box" fill="#dbeafe"/><text x="1064" y="237" class="label">3 · Calibrated ray</text><text x="1064" y="279" class="body">Box center → world ray</text><text x="1064" y="320" class="small">ViewportPointToRay + captured pose</text>
<rect x="60" y="414" width="470" height="126" class="box" fill="#dbeafe"/><text x="84" y="459" class="label">Environment depth · MRUK</text><text x="84" y="501" class="body">Measured surfaces, not object identity</text><path class="edge" d="M530 477H680"/>
<rect x="680" y="414" width="760" height="126" class="box" fill="#e0e7ff"/><text x="704" y="459" class="label">4 · Center depth hit → native spatial anchor</text><text x="704" y="501" class="body">Place root once · Wait for Localized + IsTracked</text>
<rect x="60" y="596" width="470" height="145" class="box" fill="#dbeafe"/><text x="84" y="642" class="label">5 · Compositor passthrough</text><text x="84" y="684" class="body">Normal first-person view</text><text x="84" y="719" class="small">Not a camera-video panel</text>
<rect x="640" y="596" width="800" height="145" class="box" fill="#ccfbf1"/><text x="664" y="642" class="label">6 · Session-anchored labels only</text><text x="664" y="684" class="body">Stable root · Rotate the text child only</text><text x="664" y="719" class="small">A freezes observations · B clears · No saved cross-relaunch anchors</text>
<text x="60" y="802" class="small">Source: unity/QuestYolo.cs · Start() → Decode() → Observe() · Diagram is a schematic, not measured geometry.</text></svg>