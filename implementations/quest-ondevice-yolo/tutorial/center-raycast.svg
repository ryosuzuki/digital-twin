<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="844" viewBox="0 0 1500 844" role="img" aria-labelledby="title desc"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52657c"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:43px;font-weight:700}.sub{font-size:23px;fill:#52657c}.label{font-size:27px;font-weight:700}.body{font-size:23px}.small{font-size:20px;fill:#52657c}.edge{stroke:#52657c;stroke-width:3;fill:none;marker-end:url(#arrow)}.box{stroke:#c5cfdb;stroke-width:2;rx:18}</style><rect width="1500" height="844" fill="#f8fafc"/><title id="title">Center raycast: 2D detection to approximate 3D annotation</title><desc id="desc">A ray through the detected box center intersects measured environment depth. A plane through that hit, parallel to the exposure-time camera, receives the four corner rays. The result is a flat annotation, not the physical object mesh.</desc><text x="60" y="78" class="title">Yes: raycast the detected object's center</text><text x="60" y="119" class="sub">2D box + calibrated ray + environment depth → an approximate world position</text>
<path class="edge" d="M180 480L980 335"/><path d="M180 480L980 215M180 480L980 575" fill="none" stroke="#71839b" stroke-width="2" stroke-dasharray="9 8"/>
<path d="M900 180L1150 235L1150 625L900 570Z" fill="#ccfbf1" fill-opacity=".7" stroke="#0f766e" stroke-width="3"/>
<path d="M960 220L1070 245L1070 555L960 535Z" fill="none" stroke="#16a34a" stroke-width="6"/>
<path d="M982 310L1015 315L1028 465L995 500L971 450Z" fill="#bfdbfe" stroke="#52657c" stroke-width="2"/>
<circle cx="993" cy="333" r="10" fill="#0f766e"/>
<path d="M130 440H185L225 418V540L185 518H130Z" fill="#dbeafe" stroke="#52657c" stroke-width="3"/>
<text x="60" y="590" class="label">Camera pose at exposure</text><text x="60" y="628" class="small">Not the later head pose after inference</text>
<text x="420" y="320" class="label">Calibrated center ray</text><text x="420" y="356" class="body">p = origin + distance × direction</text>
<path class="edge" d="M1230 340H1020"/><text x="1190" y="285" class="label">Depth hit</text><text x="1190" y="315" class="small">Measured surface point</text>
<text x="840" y="680" class="label">Flat annotation plane</text><text x="840" y="716" class="small">Four corner rays intersect this plane</text>
<rect x="60" y="745" width="1380" height="63" class="box" fill="#fff1f2"/><text x="84" y="785" class="body">Caution: the center can hit the background. This is not object segmentation or a true 3D bounding box.</text></svg>